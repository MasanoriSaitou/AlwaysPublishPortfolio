<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>クイズ問題編集</title>
    <style>
        #drop-area {
            width: 400px;
            height: 200px;
            border: 2px dashed #666;
            border-radius: 10px;
            text-align: center;
            line-height: 200px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h2>クイズ問題編集（管理者）</h2>

<div id="drop-area">ここに JSON をドラッグ＆ドロップ</div>

<form id="upload-form" action="/quiz/upload" method="post" enctype="multipart/form-data" style="display:none;">
    <input type="file" id="file-input" name="file">
</form>

<h3>アップロード済みファイル一覧</h3>
<ul>
    <li th:each="file : ${files}">
        <span th:text="${file}"></span>
        <a th:href="@{'/quiz/delete/' + ${file}}">
            <button type="button">削除</button>
        </a>
    </li>
</ul>

<div style="margin-top:20px;">
    <a href="/dashboard">
        <button type="button">戻る</button>
    </a>
</div>

<script>
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("file-input");
    const uploadForm = document.getElementById("upload-form");

    dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.style.background = "#eef";
    });

    dropArea.addEventListener("dragleave", () => {
        dropArea.style.background = "";
    });

    dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.style.background = "";

        const file = e.dataTransfer.files[0];
        fileInput.files = e.dataTransfer.files;
        uploadForm.submit();
    });
</script>

</body>
</html>
